<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">删除与恢复：发生了什么？</title><desc id="desc">所有参与设备需使用 0.5.0；旧版客户端不会隐藏删除状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ec842e"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#ec842e"/></marker></defs><rect width="1200" height="560" rx="24" fill="#f6f7f3"/><g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="55" font-size="29" fill="#263a41" font-weight="600">删除与恢复：发生了什么？</text><text x="40" y="91" font-size="17" fill="#63736f" font-weight="400">所有参与设备需使用 0.5.0；旧版客户端不会隐藏删除状态。</text><rect x="40" y="140" width="325" height="200" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="64" y="175" font-size="13" fill="#b6652f" font-weight="600">01 / 正常阅读</text><text x="64" y="214" font-size="23" fill="#263a41" font-weight="600">活动书库</text><text x="64" y="252" font-size="17" fill="#53646a" font-weight="400">书籍出现在书库中</text><text x="64" y="283" font-size="17" fill="#53646a" font-weight="400">进度、书签与批注可继续使用</text><rect x="438" y="140" width="325" height="200" rx="18" fill="#fff4e8" stroke="#d9e0de"/><text x="462" y="175" font-size="13" fill="#b6652f" font-weight="600">02 / 删除图书并确认</text><text x="462" y="214" font-size="23" fill="#263a41" font-weight="600">最近删除</text><text x="462" y="252" font-size="17" fill="#53646a" font-weight="400">删除状态随书库同步</text><text x="462" y="283" font-size="17" fill="#53646a" font-weight="400">原文件与阅读记录保留</text><rect x="835" y="140" width="325" height="200" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="859" y="175" font-size="13" fill="#b6652f" font-weight="600">03 / 随时恢复</text><text x="859" y="214" font-size="23" fill="#263a41" font-weight="600">恢复到书库</text><text x="859" y="252" font-size="17" fill="#53646a" font-weight="400">点更多选项 → 恢复图书</text><text x="859" y="283" font-size="17" fill="#53646a" font-weight="400">恢复状态也会同步</text><path d="M377 240 L425 240" stroke="#ec842e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M775 240 L823 240" stroke="#ec842e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="40" y="380" width="1120" height="112" rx="18" fill="#eaf0eb" stroke="#d9e0de"/><text x="64" y="423" font-size="23" fill="#263a41" font-weight="600">需要节省磁盘空间？</text><text x="64" y="460" font-size="17" fill="#53646a" font-weight="400">使用「释放本地空间」或云盘客户端的按需下载功能。删除书目不释放正文，也不删除 Apple Books 原书。</text><text x="40" y="538" font-size="12" fill="#7d8883" font-weight="500">BOOKS+  /  0.5.0 文档示意</text></g></svg>