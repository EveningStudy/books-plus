<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">一份云端书库，Windows 与 Mac 接着读</title><desc id="desc">Books+ 负责保存与合并；云盘客户端负责把文件送到另一台电脑。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ec842e"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#ec842e"/></marker></defs><rect width="1200" height="550" rx="24" fill="#f6f7f3"/><g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="55" font-size="29" fill="#263a41" font-weight="600">一份云端书库，Windows 与 Mac 接着读</text><text x="40" y="91" font-size="17" fill="#63736f" font-weight="400">Books+ 负责保存与合并；云盘客户端负责把文件送到另一台电脑。</text><rect x="40" y="135" width="305" height="205" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="64" y="170" font-size="13" fill="#b6652f" font-weight="600">01 / 阅读端</text><text x="64" y="209" font-size="23" fill="#263a41" font-weight="600">Windows · Books+</text><text x="64" y="247" font-size="17" fill="#53646a" font-weight="400">导入、阅读、书签与批注</text><text x="64" y="278" font-size="17" fill="#53646a" font-weight="400">保存本机备份</text><text x="64" y="309" font-size="17" fill="#53646a" font-weight="400">写入本地同步目录</text><rect x="447" y="135" width="306" height="205" rx="18" fill="#fff4e8" stroke="#d9e0de"/><text x="471" y="170" font-size="13" fill="#b6652f" font-weight="600">02 / 由云盘客户端传输</text><text x="471" y="209" font-size="23" fill="#263a41" font-weight="600">同一份云端书库</text><text x="471" y="247" font-size="17" fill="#53646a" font-weight="400">正文 + 书目 + 小封面</text><text x="471" y="278" font-size="17" fill="#53646a" font-weight="400">reader-state 阅读记录</text><text x="471" y="309" font-size="17" fill="#53646a" font-weight="400">iCloud / OneDrive / Google Drive</text><rect x="855" y="135" width="305" height="205" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="879" y="170" font-size="13" fill="#b6652f" font-weight="600">03 / 另一阅读端</text><text x="879" y="209" font-size="23" fill="#263a41" font-weight="600">macOS · Books+</text><text x="879" y="247" font-size="17" fill="#53646a" font-weight="400">连接同一书库的本地副本</text><text x="879" y="278" font-size="17" fill="#53646a" font-weight="400">读取到达本机的新记录</text><text x="879" y="309" font-size="17" fill="#53646a" font-weight="400">点「接着读」恢复位置</text><path d="M356 233 L435 233" stroke="#ec842e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M765 233 L843 233" stroke="#ec842e" stroke-width="2.5" fill="none" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="40" y="375" width="1120" height="108" rx="18" fill="#eaf0eb" stroke="#d9e0de"/><text x="64" y="418" font-size="23" fill="#263a41" font-weight="600">可选：Mac 的 Apple Books 桥</text><text x="64" y="455" font-size="17" fill="#53646a" font-weight="400">导出无 DRM EPUB / PDF 与记录；同修订 EPUB 位置可尝试回写，需留意页面对齐。</text><text x="40" y="528" font-size="12" fill="#7d8883" font-weight="500">BOOKS+  /  0.5.0 文档示意</text></g></svg>