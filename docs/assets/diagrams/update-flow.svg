<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="title desc"><title id="title">从检查更新，到继续阅读</title><desc id="desc">下载完成后由你确认安装；安装前会保存阅读进度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ec842e"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#ec842e"/></marker></defs><rect width="1200" height="565" rx="24" fill="#f6f7f3"/><g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="55" font-size="29" fill="#263a41" font-weight="600">从检查更新，到继续阅读</text><text x="40" y="91" font-size="17" fill="#63736f" font-weight="400">下载完成后由你确认安装；安装前会保存阅读进度。</text><rect x="40" y="145" width="248" height="180" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="64" y="180" font-size="13" fill="#b6652f" font-weight="600">01 / CHECK</text><text x="64" y="219" font-size="23" fill="#263a41" font-weight="600">检查版本</text><text x="64" y="257" font-size="17" fill="#53646a" font-weight="400">设置 → 软件更新</text><text x="64" y="288" font-size="17" fill="#53646a" font-weight="400">可关闭自动检查</text><rect x="330" y="145" width="248" height="180" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="354" y="180" font-size="13" fill="#b6652f" font-weight="600">02 / DOWNLOAD</text><text x="354" y="219" font-size="23" fill="#263a41" font-weight="600">下载与校验</text><text x="354" y="257" font-size="17" fill="#53646a" font-weight="400">手动下载或自动下载</text><text x="354" y="288" font-size="17" fill="#53646a" font-weight="400">校验失败拒绝安装</text><rect x="620" y="145" width="248" height="180" rx="18" fill="#fff4e8" stroke="#d9e0de"/><text x="644" y="180" font-size="13" fill="#b6652f" font-weight="600">03 / INSTALL</text><text x="644" y="219" font-size="23" fill="#263a41" font-weight="600">保存并重启</text><text x="644" y="257" font-size="17" fill="#53646a" font-weight="400">确认安装</text><text x="644" y="288" font-size="17" fill="#53646a" font-weight="400">等待保存后退出</text><rect x="910" y="145" width="250" height="180" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="934" y="180" font-size="13" fill="#b6652f" font-weight="600">04 / READ</text><text x="934" y="219" font-size="23" fill="#263a41" font-weight="600">继续阅读</text><text x="934" y="257" font-size="17" fill="#53646a" font-weight="400">重新打开新版</text><text x="934" y="288" font-size="17" fill="#53646a" font-weight="400">保留配置与阅读记录</text><path d="M295 235 L322 235" stroke="#ec842e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M585 235 L612 235" stroke="#ec842e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M875 235 L902 235" stroke="#ec842e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="40" y="365" width="545" height="130" rx="18" fill="#eaf0eb" stroke="#d9e0de"/><text x="64" y="408" font-size="23" fill="#263a41" font-weight="600">Windows</text><text x="64" y="445" font-size="17" fill="#53646a" font-weight="400">安装版可应用更新；便携版更新转为安装版。</text><text x="64" y="476" font-size="17" fill="#53646a" font-weight="400">首次从无更新器的旧版升级，需手动安装。</text><rect x="615" y="365" width="545" height="130" rx="18" fill="#eaf0eb" stroke="#d9e0de"/><text x="639" y="408" font-size="23" fill="#263a41" font-weight="600">macOS 候选包</text><text x="639" y="445" font-size="17" fill="#53646a" font-weight="400">当前本地签名包只检查版本 / 打开发布页。</text><text x="639" y="476" font-size="17" fill="#53646a" font-weight="400">自动安装需 Developer ID 与正式发布配置。</text><text x="40" y="543" font-size="12" fill="#7d8883" font-weight="500">BOOKS+  /  0.5.0 文档示意</text></g></svg>