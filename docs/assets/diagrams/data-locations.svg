<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc"><title id="title">哪些数据同步？哪些留在本机？</title><desc id="desc">不要将 Books+ 的整个应用配置目录放进云盘。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ec842e"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#ec842e"/></marker></defs><rect width="1200" height="525" rx="24" fill="#f6f7f3"/><g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="55" font-size="29" fill="#263a41" font-weight="600">哪些数据同步？哪些留在本机？</text><text x="40" y="91" font-size="17" fill="#63736f" font-weight="400">不要将 Books+ 的整个应用配置目录放进云盘。</text><rect x="40" y="145" width="535" height="260" rx="18" fill="#fff4e8" stroke="#d9e0de"/><text x="64" y="180" font-size="13" fill="#b6652f" font-weight="600">共享 / 云盘客户端传输</text><text x="64" y="219" font-size="23" fill="#263a41" font-weight="600">云端书库</text><text x="64" y="257" font-size="17" fill="#53646a" font-weight="400">正文原文件与附属图片</text><text x="64" y="288" font-size="17" fill="#53646a" font-weight="400">书目、分类、小封面</text><text x="64" y="319" font-size="17" fill="#53646a" font-weight="400">阅读位置、书签、批注与删除状态</text><text x="64" y="350" font-size="17" fill="#53646a" font-weight="400">每台设备只写自己的阅读快照</text><rect x="625" y="145" width="535" height="260" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="649" y="180" font-size="13" fill="#b6652f" font-weight="600">独立 / 不上传</text><text x="649" y="219" font-size="23" fill="#263a41" font-weight="600">每台电脑的本机数据</text><text x="649" y="257" font-size="17" fill="#53646a" font-weight="400">配置与独立设备身份</text><text x="649" y="288" font-size="17" fill="#53646a" font-weight="400">尚待写入云盘的进度备份</text><text x="649" y="319" font-size="17" fill="#53646a" font-weight="400">语音模型、音频、转换与封面缓存</text><text x="649" y="350" font-size="17" fill="#53646a" font-weight="400">窗口位置、离线固定与已观察状态</text><text x="42" y="458" font-size="20" fill="#53646a" font-weight="400">「已写入云盘文件夹」表示本地写入完成；是否已上传，请同时查看云盘客户端。</text><text x="40" y="503" font-size="12" fill="#7d8883" font-weight="500">BOOKS+  /  0.5.0 文档示意</text></g></svg>